<header class="navbar">
  <div class="left-section">
    <button class="btn-toggle" (click)="toggleMenu.emit()">☰</button>
    <h1 class="brand">PharmaSoft</h1>
  </div>
  <div class="right-section">
    @if (auth.sesion(); as sesion) {
      <div class="user-details">
        <span class="user-info">{{ sesion.nombreCompleto }}</span>
        <span class="user-role">{{ sesion.roles.join(' · ') }} · expira {{ sesion.expiraEn | date: 'HH:mm' }}</span>
      </div>
      <button type="button" class="btn-logout" (click)="salir()">Cerrar sesión</button>
    }
  </div>
</header>
