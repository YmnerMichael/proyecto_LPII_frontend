<div class="card">
  <h2>{{ esEdicion() ? 'Editar Categoría' : 'Nueva Categoría' }}</h2>

  @if (error()) {
    <div class="alerta-error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="field">
      <label for="nombre">Nombre (*):</label>
      <input id="nombre" type="text" formControlName="nombre" />
      @if (form.get('nombre')?.invalid && form.get('nombre')?.touched) {
        <small class="text-danger">El nombre es obligatorio (máx. 50 caracteres).</small>
      }
    </div>

    <div class="field">
      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" rows="3" formControlName="descripcion"></textarea>
    </div>

    <div class="field-checkbox">
      <label>
        <input type="checkbox" formControlName="activo" /> Activo
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="form.invalid">Guardar</button>
      <a routerLink="/categorias" class="btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
